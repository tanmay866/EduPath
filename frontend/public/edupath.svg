<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28" role="img" aria-label="EduPath">
  <!--
    The mark from design/primitives.jsx at its own geometry rather than an
    approximation: a 28px ink square, 6px/5px padding, three 4px bars with a
    3px gap rising 7 / 11 / 15px from the baseline. Those add up to exactly the
    18px of content width, which is why the bars sit flush to both edges.

    What was here before — a violet-to-purple gradient book with a sky-blue
    arrow, rounded corners and a radial glow — came from a visual language this
    product no longer uses. Nothing on any screen looked like it.

    Square corners on purpose: nothing in this design system is round.
  -->
  <rect class="bg" width="28" height="28" fill="#12100e"/>
  <g class="bars" fill="#ffffff">
    <rect x="5"  y="15" width="4" height="7"/>
    <rect x="12" y="11" width="4" height="11"/>
    <rect x="19" y="7"  width="4" height="15"/>
  </g>

  <!--
    Inverted on a dark tab strip, the same swap the component's `dark` prop
    makes. Without it a near-black square sits on near-black chrome and the tab
    reads as empty.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ffffff; }
      .bars { fill: #12100e; }
    }
  </style>
</svg>
