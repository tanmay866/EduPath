[pytest]
testpaths = tests

# pytest-asyncio warns on every run while this is unset, because its default
# is changing: async fixtures currently take the caching scope and will take
# function scope in a future release. Stating it explicitly means the upgrade
# does not quietly change how fixtures are shared between tests.
#
# function is the value that matches the coming default and the behaviour these
# tests want — each test gets its own loop, so nothing leaks between them.
asyncio_default_fixture_loop_scope = function
